name: CI Build

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空则自动生成 v<VersionPrefix>-<MMDD>）'
        required: false
        default: ''
      draft:
        description: '创建为草稿（不自动发布，便于先检查产物）'
        type: boolean
        default: false

env:
  DOTNET_RUNTIME: net10.0
  SETUP_DOTNET_VERSION: 10.0.x

  BEAENGINE_TAG: v5.3.0

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = "$msbuildPath;$env:PATH"

          dotnet build -c Release -f net48 de4dot.netframework.sln
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item Release\net48\*.pdb, Release\net48\*.xml, Release\net48\Test.Rename.*

          dotnet publish -c Release -f $env:DOTNET_RUNTIME -o publish-$env:DOTNET_RUNTIME de4dot
          Remove-Item publish-$env:DOTNET_RUNTIME\*.pdb, publish-$env:DOTNET_RUNTIME\*.xml

      - name: Run regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 只编 net48：和发布的 de4dot.exe 一致，也避开本机可能没有的 net10 目标包
          dotnet build -c Release -p:TargetFrameworks=net48 tests/EazfuscatorTests/EazfuscatorTests.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          & tests/EazfuscatorTests/bin/Release/net48/EazfuscatorTests.exe --de4dot Release/net48/de4dot.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build BeaEngine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git clone --depth 1 --branch $env:BEAENGINE_TAG https://github.com/BeaEngine/beaengine.git beaengine

          $cmakelists = 'beaengine/CMakeLists.txt'

          # Remove cmake malpractice (would prevent -DCMAKE_MSVC_RUNTIME_LIBRARY)
          (Get-Content $cmakelists) |
            Where-Object { $_ -notmatch '\s*list\s*\(APPEND\s+BEA_FLAGS\s+/M' } |
            Set-Content $cmakelists

          # Compatibility with 2026
          (Get-Content $cmakelists) |
            ForEach-Object {
              if ($_ -match '^\s*cmake_minimum_required\s*\(') {
                @('cmake_minimum_required(VERSION 3.5)',
                  'cmake_policy(VERSION 3.5)')
              } else {
                $_
              }
            } | Set-Content -Encoding UTF8 $cmakelists

          # Win32 for .NET 4.8
          cmake -S beaengine -B build-beaengine-32 `
            -A Win32 `
            -DoptBUILD_DLL=ON `
            -DoptHAS_OPTIMIZED=ON `
            -DoptHAS_SYMBOLS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

          cmake --build build-beaengine-32 --config Release

          $dll32 = Get-ChildItem -Recurse build-beaengine-32 -Filter BeaEngine*.dll | Select-Object -First 1

          if (-not $dll32) {
            throw "32-bit BeaEngine.dll not found"
          }

          Copy-Item $dll32.FullName Release/net48/BeaEngine.dll
          Copy-Item beaengine/src/COPYING.txt Release/net48/LICENSES/LICENSE.BeaEngine.GPL.txt
          Copy-Item beaengine/src/COPYING.LESSER.txt Release/net48/LICENSES/LICENSE.BeaEngine.LGPL.txt

          # Win64 for .NET 8+
          cmake -S beaengine -B build-beaengine-64 `
            -A x64 `
            -DoptBUILD_DLL=ON `
            -DoptHAS_OPTIMIZED=ON `
            -DoptHAS_SYMBOLS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

          cmake --build build-beaengine-64 --config Release

          $dll64 = Get-ChildItem -Recurse build-beaengine-64 -Filter BeaEngine*.dll | Select-Object -First 1

          if (-not $dll64) {
            throw "64-bit BeaEngine.dll not found"
          }

          Copy-Item $dll64.FullName publish-$env:DOTNET_RUNTIME/BeaEngine.dll
          Copy-Item beaengine/src/COPYING.txt publish-$env:DOTNET_RUNTIME/LICENSES/LICENSE.BeaEngine.GPL.txt
          Copy-Item beaengine/src/COPYING.LESSER.txt publish-$env:DOTNET_RUNTIME/LICENSES/LICENSE.BeaEngine.LGPL.txt

      - uses: actions/upload-artifact@v7
        with:
          name: de4dotEx-net48
          path: Release/net48

      - uses: actions/upload-artifact@v7
        with:
          name: de4dotEx-${{ env.DOTNET_RUNTIME }}-win-x64
          path: publish-${{ env.DOTNET_RUNTIME }}

  build-linux:
    name: Build Linux artifacts & package .deb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.SETUP_DOTNET_VERSION }}

      - name: Publish ${{ env.DOTNET_RUNTIME }}
        run: |
          dotnet publish -c Release -f "${DOTNET_RUNTIME}" -o publish-${DOTNET_RUNTIME} de4dot
          rm -rf publish-${DOTNET_RUNTIME}/*.pdb publish-${DOTNET_RUNTIME}/*.xml

      - name: Build BeaEngine
        run: |
          set -euo pipefail

          git clone --depth 1 --branch "$BEAENGINE_TAG" https://github.com/BeaEngine/beaengine.git

          cmake -S beaengine -B build64 \
            -DoptBUILD_DLL=ON \
            -DoptHAS_OPTIMIZED=ON \
            -DoptHAS_SYMBOLS=OFF

          cmake --build build64

          so64=$(find build64 -name "libBeaEngine*.so" | head -n 1)
          [[ -n "$so64" ]] || { echo "libBeaEngine not found"; exit 1; }

          cp "$so64" publish-${DOTNET_RUNTIME}/libBeaEngine.so
          cp beaengine/src/COPYING.txt publish-${DOTNET_RUNTIME}/LICENSES/LICENSE.BeaEngine.GPL.txt
          cp beaengine/src/COPYING.LESSER.txt publish-${DOTNET_RUNTIME}/LICENSES/LICENSE.BeaEngine.LGPL.txt

      - name: Run regression tests
        run: |
          # 与真实样本无关的部分（识别规则 + 命令行选项）在所有平台都要过；
          # 需要桩 Unpacker-net48.exe 的场景会自动跳过。
          dotnet build -c Release -p:TargetFrameworks=${DOTNET_RUNTIME} tests/EazfuscatorTests/EazfuscatorTests.csproj
          dotnet tests/EazfuscatorTests/bin/Release/${DOTNET_RUNTIME}/EazfuscatorTests.dll --de4dot publish-${DOTNET_RUNTIME}/de4dot

      - name: Upload publish folder
        uses: actions/upload-artifact@v7
        with:
          name: de4dotEx-${{ env.DOTNET_RUNTIME }}-linux-x64
          path: publish-${{ env.DOTNET_RUNTIME }}

      - name: Extract version from Git tag
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create .deb package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p deb-root/opt/de4dotEx
          cp -r publish-${DOTNET_RUNTIME}/* deb-root/opt/de4dotEx/

          mkdir -p deb-root/usr/local/bin
          ln -s /opt/de4dotEx/de4dot deb-root/usr/local/bin/de4dot

          mkdir -p deb-root/DEBIAN
          cat <<EOF > deb-root/DEBIAN/control
          Package: de4dotEx
          Version: ${{ steps.get_version.outputs.VERSION }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: G DATA Advanced Analytics GmbH <mwa@gdata-adan.de>
          Depends: libicu78 | libicu77 | libicu76 | libicu74 | libicu72 | libicu70 | libicu67 | libicu66
          Description: .NET deobfuscator and unpacker
           de4dot is a .NET deobfuscator and unpacker. It will try its best to
           restore a packed and obfuscated assembly to almost the original
           assembly.
           .
           Most of the obfuscation can be completely restored (e.g., string
           encryption), but symbol renaming is impossible to restore since the
           original names aren't (usually) part of the obfuscated assembly.
          EOF

          dpkg-deb --build deb-root de4dotEx-${{ steps.get_version.outputs.VERSION }}.deb

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: de4dotEx-${{ steps.get_version.outputs.VERSION }}-${{ env.DOTNET_RUNTIME }}-x64-deb
          path: de4dotEx-${{ steps.get_version.outputs.VERSION }}.deb
          archive: false

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image metadata for GHCR
        id: docker_meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          IMAGE="${GITHUB_REPOSITORY,,}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.docker_meta.outputs.image }}:${{ steps.docker_meta.outputs.version }}
            ${{ steps.docker_meta.outputs.image }}:latest

  release:
    name: Publish GitHub release
    needs: [ build-windows, build-linux ]
    # 推 tag 就发布；手动触发也发布（版本号留空则自动生成）。
    # 普通分支推送只跑构建和测试，不产生 Release，避免刷屏。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release assets
        id: pack
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            if [ -n "${INPUT_VERSION:-}" ]; then
              TAG="$INPUT_VERSION"
            else
              # 自动版本号：项目 VersionPrefix + UTC 日期，如 v3.11.0-1020
              VER=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' De4DotCommon.props)
              TAG="v${VER}-$(date -u +%m%d)"
            fi
          fi
          [[ "$TAG" == v* ]] || TAG="v$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          shopt -s nullglob

          # 目录型产物（net48 / net10.0-win-x64 / net10.0-linux-x64）打成 zip；
          # .deb 本身已是单个文件，原样作为附件。
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            deb=("$dir"*.deb)
            if [ ${#deb[@]} -gt 0 ]; then
              cp "${deb[0]}" dist/
              continue
            fi
            suffix="${name#de4dotEx-}"
            ( cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/de4dotEx-${TAG#v}-${suffix}.zip" . )
          done

          ls -lh dist

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          VERSION: ${{ steps.pack.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          {
            echo "基于提交 \`${GITHUB_SHA::7}\` 的自动构建产物。"
            echo
            echo "\`net48\` 包解压即用；\`net10.0\` 包为自包含发布，无需预装 .NET 运行时。"
            echo "BeaEngine 本地库与许可证已一并打入对应包内。"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for f in dist/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "变更记录：https://github.com/${GITHUB_REPOSITORY}/compare/${TAG}...master"
          } > notes.md

          PRERELEASE=()
          # 只有 v3.11.0-beta1 这类语义化预发布才标记 prerelease；
          # v3.11.0-1020 这种日期快照仍是正式版
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z] ]]; then
            PRERELEASE=(--prerelease)
          fi

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 重跑同一 tag：覆盖附件，不重复建 Release
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            ARGS=(--target "$GITHUB_SHA" --title "de4dotEx ${TAG}" --notes-file notes.md)
            if [ "${DRAFT:-false}" = "true" ]; then
              ARGS+=(--draft)
            elif [ ${#PRERELEASE[@]} -gt 0 ]; then
              ARGS+=("${PRERELEASE[@]}")
            else
              ARGS+=(--latest)
            fi
            gh release create "$TAG" "${ARGS[@]}" dist/*
          fi

          echo "::notice title=Release 已发布::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
